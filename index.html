<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Backpack computer</title>
    <style>
        @font-face {
            font-family: minecraft;
            src: url(res/fonts/Minecraft.ttf);
        }

        :root {
            /* Screen colors */
            --drawing: #50815d;/*#5dd85a;*/
            --bg-light: #1f2f19;
            --bg-dark: #0f160c;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        #maincv {
            position: fixed;
            display: none;

            width: 200px;

            image-rendering: pixelated;

            outline: 1px solid red;

            background-color: var(--bg-light);
        }

        #title {
            position: fixed;

            text-align: left;

            margin: 5px;
            padding: 0px;

            width: 100%;

            color: var(--drawing);
            background-color: transparent;

            font-family: monospace;
            font-size: 32px;
            font-weight: 400;

            filter: blur(0.75px);

            pointer-events: none;
        }

        #title.center {
            top: 50%;

            transform: translateY(-50%);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="title" class="center">Loading...</h1>
    <canvas id="maincv"></canvas>

    <!-- Load THREE.js -->
    <script defer type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>

    <script defer src="objects.js"></script>
    <script defer src="bpcomp.js"></script>
    <script defer type="module" src="main.js"></script>
</body>
</html>
